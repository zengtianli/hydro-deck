name: hydro-deck
origin: own
lifecycle: active
form: ios
platforms: [iphone, ipad, mac]   # 跑在哪（正交于 form=源码住哪）；multiplatform.py audit 与 project.yml 对账

one_liner: 水利 agent 随身版 —— 对着领域后端问一句，SSE 流式看答案与引文（authgate 闸内）

stack: swift-ui
notes: |
  薄壳聊天客户端,业务零本地逻辑:后端 = ~/Dev/services/hydro-agent
  (线上 https://hydro-agent.tianli.cyou,authgate 闸后)。
  app 只做四件事:闸登录(Gate.swift,从 day-deck 移植) / POST /api/chat/stream 收 SSE /
  markdown 流式渲染(MarkdownView.swift,从 day-deck 逐字移植,舰队契约 6) / 引文与步骤展示。

  SSE 契约以后端 obs/events.py 为 SSOT(判别字段 type,业务在 payload;
  帧形状 event:/data:/id: 三行,心跳是 `: ping` 注释帧)。客户端只消费
  run.start / step.start / tool.call / tool.result / answer.delta(reset) /
  error(nonfatal) / run.end,其余事件忽略 —— 后端加事件不需要动 app。

  真机装机走 ./install-to-iphone.sh(总部 shim);闸密码喂法 bash seed-gate.sh(总部 shim)。
